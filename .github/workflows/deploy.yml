# Historical deploy entry is deliberately manual validation only. No deployment job or provider secrets.
name: Manual operator validation (no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - name: Deterministic install
        run: npm ci
      - name: Offline syntax, runtime, source and build validation
        run: npm run validate
